name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Test, lint and build debug APK
        run: gradle testDebugUnitTest lintDebug assembleDebug -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: FlowPay-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SIGNING_KEY_BASE64: ${{ secrets.FLOWPAY_KEYSTORE_BASE64 }}
      SIGNING_KEY_PASSWORD: ${{ secrets.FLOWPAY_KEYSTORE_PASSWORD }}
    steps:
      - name: Check release signing configuration
        id: signing
        shell: bash
        run: |
          if [[ -n "$SIGNING_KEY_BASE64" && -n "$SIGNING_KEY_PASSWORD" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signed release skipped: configure FLOWPAY_KEYSTORE_BASE64 and FLOWPAY_KEYSTORE_PASSWORD"
            echo "### Signed release was not published" >> "$GITHUB_STEP_SUMMARY"
            echo "Configure FLOWPAY_KEYSTORE_BASE64 and FLOWPAY_KEYSTORE_PASSWORD in repository Actions secrets." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        if: ${{ steps.signing.outputs.enabled == 'true' }}
      - uses: actions/setup-java@v4
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        if: ${{ steps.signing.outputs.enabled == 'true' }}
      - name: Install Android 16 SDK
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        with:
          gradle-version: "8.11.1"
      - name: Prepare private signing key
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        run: echo "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/flowpay-release.p12"
      - name: Build signed release APK
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        env:
          FLOWPAY_KEYSTORE_PATH: ${{ runner.temp }}/flowpay-release.p12
          FLOWPAY_KEYSTORE_PASSWORD: ${{ env.SIGNING_KEY_PASSWORD }}
        run: |
          gradle assembleRelease -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}
          mv app/build/outputs/apk/release/app-release.apk "FlowPay-1.0.${{ github.run_number }}.apk"
      - name: Upload signed APK artifact
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: FlowPay-release-apk
          path: FlowPay-*.apk
      - name: Publish update for the app
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: FlowPay 1.0.${{ github.run_number }}
          body: |
            Автоматичне оновлення FlowPay.
            versionCode=${{ github.run_number }}
          files: FlowPay-*.apk
          make_latest: true

