name: Build Android APK
on: {push: {branches: [main]}, workflow_dispatch: {}}
permissions: {contents: write}
jobs:
 build:
  runs-on: ubuntu-latest
  env:
   SIGNING_KEY_BASE64: ${{ secrets.FLOWPAY_KEYSTORE_BASE64 }}
   SIGNING_KEY_PASSWORD: ${{ secrets.FLOWPAY_KEYSTORE_PASSWORD }}
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with: {distribution: temurin, java-version: "17"}
   - uses: android-actions/setup-android@v3
   - uses: gradle/actions/setup-gradle@v4
     with: {gradle-version: "8.10.2"}
   - name: Build installable debug APK
     run: gradle assembleDebug -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}
   - uses: actions/upload-artifact@v4
     with: {name: FlowPay-debug-apk, path: app/build/outputs/apk/debug/app-debug.apk}
   - name: Prepare private signing key
     if: ${{ env.SIGNING_KEY_BASE64 != '' && env.SIGNING_KEY_PASSWORD != '' }}
     run: echo "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/flowpay-release.p12"
   - name: Build signed release APK
     if: ${{ env.SIGNING_KEY_BASE64 != '' && env.SIGNING_KEY_PASSWORD != '' }}
     env:
      FLOWPAY_KEYSTORE_PATH: ${{ runner.temp }}/flowpay-release.p12
      FLOWPAY_KEYSTORE_PASSWORD: ${{ env.SIGNING_KEY_PASSWORD }}
     run: |
      gradle assembleRelease -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}
      mv app/build/outputs/apk/release/app-release.apk "FlowPay-1.0.${{ github.run_number }}.apk"
   - name: Upload signed APK artifact
     if: ${{ env.SIGNING_KEY_BASE64 != '' && env.SIGNING_KEY_PASSWORD != '' }}
     uses: actions/upload-artifact@v4
     with:
      name: FlowPay-release-apk
      path: FlowPay-*.apk
   - name: Publish update for the app
     if: ${{ env.SIGNING_KEY_BASE64 != '' && env.SIGNING_KEY_PASSWORD != '' }}
     uses: softprops/action-gh-release@v2
     with:
      tag_name: v1.0.${{ github.run_number }}
      name: FlowPay 1.0.${{ github.run_number }}
      body: |
       Автоматичне оновлення FlowPay.
       versionCode=${{ github.run_number }}
      files: FlowPay-*.apk
      make_latest: true
