name: Build Android APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: yes | sdkmanager --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and build debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: FlowPay-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload test and lint reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: FlowPay-build-reports
          path: |
            app/build/reports/**
            app/build/outputs/lint-results-*.*
          if-no-files-found: ignore

  # Publishing is driven by a version tag and nothing else. It used to run on
  # every push to main, which minted releases numbered from the run counter; the
  # app reads /releases/latest, so one of those becoming the latest release hid
  # the real update behind a version far below the installed one.
  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read the version out of the tag
        id: version
        run: |
          name="${GITHUB_REF_NAME#v}"
          if [[ ! "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH, so no version can be derived."
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$name"
          # The same arithmetic the app applies to a tag, so the number it
          # compares against the installed build always matches.
          code=$(( major * 10000 + minor * 100 + patch ))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Require the signing key
        env:
          KEY_PRESENT: ${{ secrets.FLOWPAY_KEYSTORE_BASE64 != '' && secrets.FLOWPAY_KEYSTORE_PASSWORD != '' }}
        run: |
          if [[ "$KEY_PRESENT" != "true" ]]; then
            echo "::error::FLOWPAY_KEYSTORE_BASE64 and FLOWPAY_KEYSTORE_PASSWORD are not configured, so this build could only be signed with a throwaway key. The phone refuses an update whose certificate differs from the installed copy, so publishing stops here rather than shipping a file that cannot be installed."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: yes | sdkmanager --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore the signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.FLOWPAY_KEYSTORE_BASE64 }}
        run: echo "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/flowpay.keystore"

      - name: Build the signed release APK
        env:
          FLOWPAY_KEYSTORE_PATH: ${{ runner.temp }}/flowpay.keystore
          FLOWPAY_KEYSTORE_PASSWORD: ${{ secrets.FLOWPAY_KEYSTORE_PASSWORD }}
          # Defaults describe the key the phone already trusts: the local debug
          # keystore, whose alias is fixed by the SDK. Both are overridable for
          # the day this moves to a keystore of its own.
          FLOWPAY_KEYSTORE_ALIAS: ${{ secrets.FLOWPAY_KEYSTORE_ALIAS || 'androiddebugkey' }}
          FLOWPAY_KEYSTORE_TYPE: ${{ secrets.FLOWPAY_KEYSTORE_TYPE || 'jks' }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          ./gradlew assembleRelease -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"
          # One APK per release, with the version in its name: the in-app updater
          # picks the asset whose name carries the release version, and a second
          # file once made it install a stale build in a loop.
          mv app/build/outputs/apk/release/app-release.apk "FlowPay-v$VERSION_NAME.apk"

      - name: Confirm the APK is signed and carries the expected version
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          tools="$ANDROID_HOME/build-tools/36.0.0"
          apk="FlowPay-v$VERSION_NAME.apk"
          "$tools/apksigner" verify --print-certs "$apk"
          code=$("$tools/aapt2" dump badging "$apk" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          if [[ "$code" != "$VERSION_CODE" ]]; then
            echo "::error::The APK reports versionCode $code but the tag means $VERSION_CODE."
            exit 1
          fi

      - name: Publish the update
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: FlowPay ${{ steps.version.outputs.name }}
          body: |
            Автоматичне оновлення FlowPay.
            versionCode=${{ steps.version.outputs.code }}
          files: FlowPay-v${{ steps.version.outputs.name }}.apk
          make_latest: true
