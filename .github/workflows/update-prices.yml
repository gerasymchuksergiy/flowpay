name: Update product prices
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: price-update
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update prices with Gemini
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/update_prices.py
      - name: Commit updated history
        run: |
          git config user.name "flowpay-bot"
          git config user.email "flowpay-bot@users.noreply.github.com"
          git add data/products.json
          git diff --cached --quiet || git commit -m "chore: update product prices"
          git push
